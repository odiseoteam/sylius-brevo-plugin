default:
    suites:
        ui_sending_ecommerce_events_to_brevo:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session
                - odiseo_brevo.behat.context.hook.fake_client

                - sylius.behat.context.transform.address
                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.country
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.payment
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.shared_storage
                - sylius.behat.context.transform.shipping_method
                - sylius.behat.context.transform.taxon
                - sylius.behat.context.transform.zone

                - sylius.behat.context.setup.cart
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.checkout.address
                - sylius.behat.context.setup.geographical
                - sylius.behat.context.setup.payment
                - sylius.behat.context.setup.product
                - sylius.behat.context.setup.product_taxon
                - sylius.behat.context.setup.shipping
                - sylius.behat.context.setup.taxonomy
                - sylius.behat.context.setup.zone
                - odiseo_brevo.behat.context.setup.brevo

                - sylius.behat.context.ui.shop.product
                - odiseo_brevo.behat.context.ui.shop.tracking
            filters:
                tags: "@sending_ecommerce_events_to_brevo&&@ui&&~@guest_checkout"

        ui_sending_ecommerce_events_to_brevo_in_the_checkout:
            contexts:
                - sylius.behat.context.hook.doctrine_orm
                - sylius.behat.context.hook.session
                - odiseo_brevo.behat.context.hook.fake_client

                - sylius.behat.context.transform.address
                - sylius.behat.context.transform.channel
                - sylius.behat.context.transform.country
                - sylius.behat.context.transform.lexical
                - sylius.behat.context.transform.payment
                - sylius.behat.context.transform.product
                - sylius.behat.context.transform.shared_storage
                - sylius.behat.context.transform.shipping_method
                - sylius.behat.context.transform.taxon
                - sylius.behat.context.transform.zone

                - sylius.behat.context.setup.cart
                - sylius.behat.context.setup.channel
                - sylius.behat.context.setup.checkout.address
                - sylius.behat.context.setup.geographical
                - sylius.behat.context.setup.payment
                - sylius.behat.context.setup.product
                - sylius.behat.context.setup.product_taxon
                - sylius.behat.context.setup.shipping
                - sylius.behat.context.setup.taxonomy
                - sylius.behat.context.setup.zone
                - odiseo_brevo.behat.context.setup.brevo

                - sylius.behat.context.ui.shop.cart
                - sylius.behat.context.ui.shop.checkout
                - sylius.behat.context.ui.shop.checkout.addressing
                - sylius.behat.context.ui.shop.checkout.complete
                - odiseo_brevo.behat.context.ui.brevo_requests
            filters:
                tags: "@sending_ecommerce_events_to_brevo&&@ui&&@guest_checkout"
