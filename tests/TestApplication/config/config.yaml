imports:
    - { resource: "@OdiseoSyliusBrevoPlugin/config/config.yaml" }
    - { resource: "services_test.php" }

twig:
    paths:
        '%kernel.project_dir%/../../../tests/TestApplication/templates': ~

framework:
    router:
        # Host, scheme and port for URLs generated outside a request (workers, CLI).
        default_uri: '%env(DEFAULT_URI)%'

when@test:
    framework:
        cache:
            pools:
                # Tests reuse product codes: hashes from an earlier test would skip sends.
                odiseo_brevo.cache.product_hashes:
                    adapter: cache.adapter.array
