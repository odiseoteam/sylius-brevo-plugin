services:
    odiseo_brevo.encrypter.api_key:
        class: Odiseo\SyliusBrevoPlugin\Encryption\ApiKeyEncrypter
        arguments:
            - '@sylius.encrypter'

    Odiseo\SyliusBrevoPlugin\Encryption\ApiKeyEncrypterInterface: '@odiseo_brevo.encrypter.api_key'

    odiseo_brevo.encrypter.channel_configuration:
        class: Odiseo\SyliusBrevoPlugin\Encryption\ChannelConfigurationEncrypter
        arguments:
            - '@odiseo_brevo.encrypter.api_key'

    odiseo_brevo.listener.channel_configuration_encryption:
        class: Sylius\Bundle\PaymentBundle\Listener\EntityEncryptionListener
        arguments:
            - '@odiseo_brevo.encrypter.channel_configuration'
            - '%odiseo_brevo.model.channel_configuration.class%'
        # Encrypt only: decrypting in the entity would leave it encrypted during flushes and re-save it on each one.
        tags:
            - { name: doctrine.event_listener, event: onFlush }

    Odiseo\SyliusBrevoPlugin\Repository\ChannelConfigurationRepositoryInterface: '@odiseo_brevo.repository.channel_configuration'

    odiseo_brevo.provider.configuration:
        class: Odiseo\SyliusBrevoPlugin\Configuration\ConfigurationProvider
        arguments:
            - '@odiseo_brevo.repository.channel_configuration'
            - '@odiseo_brevo.encrypter.api_key'
            - '%odiseo_brevo.api.key%'

    Odiseo\SyliusBrevoPlugin\Configuration\ConfigurationProviderInterface: '@odiseo_brevo.provider.configuration'

    odiseo_brevo.registry.module:
        class: Odiseo\SyliusBrevoPlugin\Module\ModuleRegistry
        arguments:
            - !tagged_iterator odiseo_brevo.module

    Odiseo\SyliusBrevoPlugin\Module\ModuleRegistryInterface: '@odiseo_brevo.registry.module'

    odiseo_brevo.checker.module:
        class: Odiseo\SyliusBrevoPlugin\Module\ModuleChecker
        arguments:
            - '@odiseo_brevo.provider.configuration'
            - '@odiseo_brevo.registry.module'

    Odiseo\SyliusBrevoPlugin\Module\ModuleCheckerInterface: '@odiseo_brevo.checker.module'

    odiseo_brevo.validator.required_modules:
        class: Odiseo\SyliusBrevoPlugin\Validator\Constraints\RequiredModulesValidator
        arguments:
            - '@odiseo_brevo.registry.module'
            - '@translator'
        tags:
            - { name: validator.constraint_validator, alias: odiseo_brevo_required_modules }
