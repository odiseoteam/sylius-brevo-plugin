services:
    odiseo_brevo.catalog.module:
        class: Odiseo\SyliusBrevoPlugin\Catalog\CatalogModule
        tags:
            - { name: odiseo_brevo.module }

    odiseo_brevo.catalog.channel_taxons:
        class: Odiseo\SyliusBrevoPlugin\Catalog\ChannelTaxons
        arguments:
            - '@doctrine.orm.entity_manager'
            - '%sylius.model.taxon.class%'

    Odiseo\SyliusBrevoPlugin\Catalog\ChannelTaxonsInterface: '@odiseo_brevo.catalog.channel_taxons'

    odiseo_brevo.catalog.category_payload_builder:
        class: Odiseo\SyliusBrevoPlugin\Catalog\CategoryPayloadBuilder
        arguments:
            - '@odiseo_brevo.catalog.channel_taxons'
            - '@odiseo_brevo.routing.channel_url_generator'

    Odiseo\SyliusBrevoPlugin\Catalog\CategoryPayloadBuilderInterface: '@odiseo_brevo.catalog.category_payload_builder'

    odiseo_brevo.catalog.target_resolver:
        class: Odiseo\SyliusBrevoPlugin\Catalog\CatalogTargetResolver
        arguments:
            - '@odiseo_brevo.repository.channel_configuration'
            - '@odiseo_brevo.provider.configuration'
            - '@odiseo_brevo.catalog.channel_taxons'

    Odiseo\SyliusBrevoPlugin\Catalog\CatalogTargetResolverInterface: '@odiseo_brevo.catalog.target_resolver'

    odiseo_brevo.catalog.ecommerce_activator:
        class: Odiseo\SyliusBrevoPlugin\Catalog\EcommerceActivator
        arguments:
            - '@odiseo_brevo.provider.configuration'
            - '@odiseo_brevo.client.api.ecommerce'

    Odiseo\SyliusBrevoPlugin\Catalog\EcommerceActivatorInterface: '@odiseo_brevo.catalog.ecommerce_activator'

    odiseo_brevo.catalog.handler.activate_ecommerce:
        class: Odiseo\SyliusBrevoPlugin\Catalog\MessageHandler\ActivateEcommerceHandler
        arguments:
            - '@sylius.repository.channel'
            - '@odiseo_brevo.catalog.ecommerce_activator'
        tags:
            - { name: messenger.message_handler, bus: odiseo_brevo.bus }

    odiseo_brevo.catalog.handler.sync_categories:
        class: Odiseo\SyliusBrevoPlugin\Catalog\MessageHandler\SyncCategoriesHandler
        arguments:
            - '@sylius.repository.channel'
            - '@sylius.repository.taxon'
            - '@odiseo_brevo.provider.configuration'
            - '@odiseo_brevo.catalog.category_payload_builder'
            - '@odiseo_brevo.client.api.ecommerce'
        tags:
            - { name: messenger.message_handler, bus: odiseo_brevo.bus }

    odiseo_brevo.catalog.listener.taxon_changes:
        class: Odiseo\SyliusBrevoPlugin\Catalog\EventListener\TaxonChangesListener
        arguments:
            - '@odiseo_brevo.catalog.target_resolver'
            - '@odiseo_brevo.messenger.dispatcher'
        tags:
            - { name: doctrine.event_listener, event: onFlush }
            - { name: doctrine.event_listener, event: postFlush }
            - { name: kernel.reset, method: reset }

    odiseo_brevo.catalog.listener.ecommerce_activation:
        class: Odiseo\SyliusBrevoPlugin\Catalog\EventListener\EcommerceActivationListener
        arguments:
            - '@odiseo_brevo.messenger.dispatcher'
        tags:
            - { name: kernel.event_listener, event: odiseo_brevo.channel_configuration.post_create }
            - { name: kernel.event_listener, event: odiseo_brevo.channel_configuration.post_update }

    odiseo_brevo.catalog.command.activate_ecommerce:
        class: Odiseo\SyliusBrevoPlugin\Catalog\Command\ActivateEcommerceCommand
        arguments:
            - '@odiseo_brevo.catalog.target_resolver'
            - '@odiseo_brevo.catalog.ecommerce_activator'
        tags:
            - { name: console.command }

    odiseo_brevo.catalog.command.sync_categories:
        class: Odiseo\SyliusBrevoPlugin\Catalog\Command\SyncCategoriesCommand
        arguments:
            - '@odiseo_brevo.catalog.target_resolver'
            - '@odiseo_brevo.provider.configuration'
            - '@odiseo_brevo.catalog.channel_taxons'
            - '@odiseo_brevo.catalog.category_payload_builder'
            - '@odiseo_brevo.client.api.ecommerce'
        tags:
            - { name: console.command }

    odiseo_brevo.catalog.product.details_provider:
        class: Odiseo\SyliusBrevoPlugin\Catalog\Product\ProductDetailsProvider
        arguments:
            - '@odiseo_brevo.routing.channel_url_generator'
        tags:
            - { name: odiseo_brevo.product_payload_provider, priority: 300 }

    odiseo_brevo.catalog.product.price_provider:
        class: Odiseo\SyliusBrevoPlugin\Catalog\Product\ProductPriceProvider
        arguments:
            - '@odiseo_brevo.formatter.money'
        tags:
            - { name: odiseo_brevo.product_payload_provider, priority: 200 }

    odiseo_brevo.catalog.product.categories_provider:
        class: Odiseo\SyliusBrevoPlugin\Catalog\Product\ProductCategoriesProvider
        arguments:
            - '@odiseo_brevo.catalog.channel_taxons'
        tags:
            - { name: odiseo_brevo.product_payload_provider, priority: 100 }

    odiseo_brevo.catalog.product_payload_builder:
        class: Odiseo\SyliusBrevoPlugin\Catalog\ProductPayloadBuilder
        arguments:
            - !tagged_iterator odiseo_brevo.product_payload_provider

    Odiseo\SyliusBrevoPlugin\Catalog\ProductPayloadBuilderInterface: '@odiseo_brevo.catalog.product_payload_builder'

    odiseo_brevo.catalog.product_sender:
        class: Odiseo\SyliusBrevoPlugin\Catalog\ProductSender
        arguments:
            - '@odiseo_brevo.client.api.ecommerce'
            - '@odiseo_brevo.cache.product_hashes'

    Odiseo\SyliusBrevoPlugin\Catalog\ProductSenderInterface: '@odiseo_brevo.catalog.product_sender'

    odiseo_brevo.catalog.product_variant_batches:
        class: Odiseo\SyliusBrevoPlugin\Catalog\ProductVariantBatches
        arguments:
            - '@doctrine.orm.entity_manager'
            - '%sylius.model.product_variant.class%'

    Odiseo\SyliusBrevoPlugin\Catalog\ProductVariantBatchesInterface: '@odiseo_brevo.catalog.product_variant_batches'

    odiseo_brevo.catalog.handler.sync_products:
        class: Odiseo\SyliusBrevoPlugin\Catalog\MessageHandler\SyncProductsHandler
        arguments:
            - '@sylius.repository.channel'
            - '@sylius.repository.product_variant'
            - '@odiseo_brevo.provider.configuration'
            - '@odiseo_brevo.catalog.product_payload_builder'
            - '@odiseo_brevo.catalog.product_sender'
        tags:
            - { name: messenger.message_handler, bus: odiseo_brevo.bus }

    odiseo_brevo.catalog.listener.product_changes:
        class: Odiseo\SyliusBrevoPlugin\Catalog\EventListener\ProductChangesListener
        arguments:
            - '@odiseo_brevo.catalog.target_resolver'
            - '@odiseo_brevo.messenger.dispatcher'
        tags:
            - { name: doctrine.event_listener, event: onFlush }
            - { name: doctrine.event_listener, event: postFlush }
            - { name: kernel.reset, method: reset }

    odiseo_brevo.catalog.command.sync_products:
        class: Odiseo\SyliusBrevoPlugin\Catalog\Command\SyncProductsCommand
        arguments:
            - '@odiseo_brevo.catalog.target_resolver'
            - '@odiseo_brevo.provider.configuration'
            - '@sylius.repository.channel'
            - '@odiseo_brevo.catalog.product_variant_batches'
            - '@odiseo_brevo.catalog.product_payload_builder'
            - '@odiseo_brevo.catalog.product_sender'
        tags:
            - { name: console.command }
