sylius_grid:
    grids:
        odiseo_brevo_admin_channel_configuration:
            driver:
                name: doctrine/orm
                options:
                    class: "%odiseo_brevo.model.channel_configuration.class%"
            fields:
                channel:
                    type: twig
                    label: sylius.ui.channel
                    options:
                        template: "@SyliusAdmin/shared/grid/field/channel.html.twig"
                senderEmail:
                    type: string
                    label: odiseo_brevo.ui.sender_email
                enabled:
                    type: twig
                    label: sylius.ui.enabled
                    options:
                        template: "@SyliusAdmin/shared/grid/field/boolean.html.twig"
                updatedAt:
                    type: twig
                    label: sylius.ui.updating_date
                    sortable: ~
                    options:
                        template: "@SyliusAdmin/shared/grid/field/date.html.twig"
                        vars:
                            th_class: "w-1 text-center"
            actions:
                main:
                    create:
                        type: create
                item:
                    update:
                        type: update
                    delete:
                        type: delete
