sylius_twig_hooks:
    hooks:
        'odiseo_brevo.admin.channel_configuration.update.content':
            form:
                template: '@SyliusAdmin/shared/crud/common/content/form.html.twig'
                configuration:
                    method: 'PUT'
                    render_rest: false
                priority: 0

        'odiseo_brevo.admin.channel_configuration.update.content.form':
            # Same name as the Sylius common form hookable, so it replaces it.
            sections:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/tabs.html.twig'
                priority: 0

        'odiseo_brevo.admin.channel_configuration.update.content.form.side_navigation':
            general:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/side_navigation/tab.html.twig'
                configuration:
                    tab: general
                    label: sylius.ui.general
                    active: true
                priority: 300
            contacts:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/side_navigation/tab.html.twig'
                configuration:
                    tab: contacts
                    label: odiseo_brevo.ui.contacts
                    module: contacts
                priority: 200
            newsletter:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/side_navigation/tab.html.twig'
                configuration:
                    tab: newsletter
                    label: odiseo_brevo.ui.newsletter_settings
                    module: newsletter
                priority: 100
            tracking:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/side_navigation/tab.html.twig'
                configuration:
                    tab: tracking
                    label: odiseo_brevo.ui.tracking
                    module: tracking
                priority: 90

        'odiseo_brevo.admin.channel_configuration.update.content.form.sections':
            general:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/tab.html.twig'
                configuration:
                    tab: general
                    active: true
                priority: 300
            contacts:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/tab.html.twig'
                configuration:
                    tab: contacts
                priority: 200
            newsletter:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/tab.html.twig'
                configuration:
                    tab: newsletter
                priority: 100
            tracking:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/tab.html.twig'
                configuration:
                    tab: tracking
                priority: 90

        'odiseo_brevo.admin.channel_configuration.update.content.form.sections.general':
            # The Sylius common one renders the whole form.
            default:
                enabled: false
            missing_exchange_rates:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/missing_exchange_rates.html.twig'
                priority: 400
            general:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/general.html.twig'
                priority: 300
            account:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/account.html.twig'
                priority: 200
            sender:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/sender.html.twig'
                priority: 100
            modules:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/modules.html.twig'
                priority: 0

        'odiseo_brevo.admin.channel_configuration.update.content.form.sections.contacts':
            contacts:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/contacts.html.twig'
                priority: 0

        'odiseo_brevo.admin.channel_configuration.update.content.form.sections.newsletter':
            newsletter:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/newsletter.html.twig'
                priority: 0

        'odiseo_brevo.admin.channel_configuration.update.content.form.sections.tracking':
            tracking:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/form/sections/tracking.html.twig'
                priority: 0

        'odiseo_brevo.admin.channel_configuration.update.content.header.title_block.actions':
            test_connection:
                template: '@OdiseoSyliusBrevoPlugin/admin/channel_configuration/update/test_connection.html.twig'
                priority: 150
